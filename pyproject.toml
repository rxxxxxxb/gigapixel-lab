[project]
name = "gigapixel-lab"
version = "0.1.0"
description = "Lymph-node metastasis classification in whole-slide pathology images."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3",
    "matplotlib",
    "numpy",
    "openslide-bin>=4.0.1.2",
    "openslide-python>=1.4.7",
    "pandas",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
]

[tool.uv]
python-preference = "only-managed"
